<body>
<header>
  <div><div class="brand-title"><h1 id="appTitle">PSO2特殊能力追加シミュレーター</h1><span class="app-version">V27.9</span></div><div class="sub">by fuwashiroha</div></div>
  <div class="toolbar">
    <label class="langLabel"><span id="langText">言語</span>
      <select id="language"><option value="ja">日本語</option><option value="zh-CN">中文</option></select>
    </label>
    <button id="save">保存</button><button id="load">読込</button>
    <button id="reset">クリア</button>
  </div>
</header>
<div class="layout">
  <section class="panel left">
    <div class="panelTitle" id="listTitle">特殊能力一覧</div>
    <div class="filters"><input id="search" placeholder="能力名を検索"><select id="group"><option value="">全分類</option></select></div>
    <div id="abilityList"></div>
  </section>
  <section class="panel center">
    <div class="panelTitle" id="materialTitle">本体 / 素材</div>
    <div id="materials" class="materials"></div>
    <div class="controls">
      <label><span id="supportText">能力追加成功率</span>
        <select id="support">
          <option value="0">無し</option><option value="5">+5%</option><option value="10">+10%</option>
          <option value="20">+20%</option><option value="30">+30%</option><option value="40">+40%</option>
          <option value="45">+45%</option><option value="50">+50%</option><option value="55">+55%</option><option value="60">+60%</option>
        </select>
      </label>
      <label><span id="campaignText">報酬期間</span>
        <select id="campaign"><option value="0">無し</option><option value="5">+5%</option><option value="10">+10%</option>
        <option value="15">+15%</option><option value="20">+20%</option></select>
      </label>
      <label class="sameNameControl"><input type="checkbox" id="lifeGuidance"><span id="lifeGuidanceText">生命の導き（+10%）</span></label>
      <label class="sameNameControl" id="sameNameLabel" title="本体と、現在使用している全素材が完全に同じ装備名の場合のみ有効">
        <input type="checkbox" id="sameName"><span id="sameNameText">本体・使用素材はすべて同名</span>
      </label>
      <label class="sameNameControl" id="addItemLabel" title="使用する特殊能力追加アイテムを1つ選択します">
        <span id="addItemText">追加アイテム</span>
        <select id="addItemSelect">
          <option value="">使用しない</option>
        </select>
      </label>
      <label id="abilityProtectionLabel" title="記録用。成功率には影響しません。">
        <span id="abilityProtectionText">特殊能力保護の使用</span>
        <select id="abilityProtection">
          <option value="">使用しない</option>
          <option value="4">特殊能力保護(4枠以下)</option>
          <option value="5">特殊能力保護(5枠以下)</option>
          <option value="6">特殊能力保護(6枠以下)</option>
          <option value="7">特殊能力保護(7枠以下)</option>
          <option value="8">特殊能力保護(8枠以下)</option>
        </select>
      </label>
      <div class="junkTools">
        <label><span id="junkFillText">全本体・素材をゴミで</span>
          <select id="junkFillSlots">
            <option value="1">1S</option><option value="2">2S</option><option value="3">3S</option><option value="4">4S</option>
            <option value="5">5S</option><option value="6">6S</option><option value="7">7S</option><option value="8">8S</option>
          </select>
          <span id="junkFillSuffix">まで埋める</span>
        </label>
        <button type="button" id="junkFillBtn">実行</button>
        <button type="button" id="junkClearBtn">全ゴミ削除</button>
      </div>
    </div>
  </section>
  <section class="panel right">
    <div class="panelTitle" id="candidateTitle">追加候補 / 成功率</div>
    <label class="small" style="display:block;padding:8px"><input type="checkbox" id="lowRarityWeapon"><span id="lowRarityWeaponText">本体は★12以下の武器（アルティメットバスター用）</span></label>
    <div id="candidateBody"></div>
    <div id="summary"></div>
  </section>
</div>
<footer class="sim-copyright">PSO2 © SEGA</footer>
<div id="toast"></div>
<script src="data.js"></script>
<script src="guardian-recipes.js"></script>
<script src="rules.js"></script>
<script src="transfer.js"></script>
<script src="compact-ui.js?v=99ff2985e3"></script>
<script src="workspace.js?v=e09610eea2"></script>
<script src="boot.js?v=c5b38d91b5"></script>
</body>
</html>
